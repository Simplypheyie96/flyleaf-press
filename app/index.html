  <body>
    <!-- Launch screen. Inline and ahead of the bundle on purpose: it is the
         first paint of a cold start, so it must not wait on a stylesheet, a
         web font, or React. main.tsx fades it out once the app has rendered. -->
    <style>
      #splash{
        position:fixed; inset:0; z-index:9999;
        display:flex; align-items:center; justify-content:center;
        background:#F4F2ED; color:#1B1917;
        /* 420ms, not 260: the exit should read as the screen settling out of
           the way, not as a cut. Must stay under the 600ms removal fallback
           in main.tsx, which is what guarantees the overlay never sticks. */
        transition:opacity 420ms cubic-bezier(.22,1,.36,1);
      }
      /* the mark, the name, and one line saying what this is — a cold start on
         a phone should not be a silent rosette. Local font stacks only: the
         web fonts are still in flight at this point and a swap mid-fade is
         worse than the fallback. */
      #splash-in{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:0 32px; }
      #splash svg{ width:88px; height:88px; }
      #splash b{
        display:block; margin-top:22px; font:500 25px/1.1 "Playfair Display",Georgia,serif;
        letter-spacing:.005em;
      }
      /* two lines, the same pair the link-preview card carries: the app makes
         reviews and it makes the monthly collage, and a launch screen naming
         only the first describes half of it */
      #splash small + small{ margin-top:3px; opacity:.62; }
      #splash small{
        display:block; margin-top:12px; max-width:22em;
        font:400 10px/1.6 "IBM Plex Mono",ui-monospace,monospace;
        letter-spacing:.14em; text-transform:uppercase; opacity:.62;
      }
      #splash.is-out{ opacity:0; pointer-events:none; }
      @media (prefers-color-scheme: dark){
        #splash{ background:#151515; color:#E9E9E9; }
      }
    </style>
